name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Sayfayı uygulamaya koy
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: APK oluştur
        run: cd android && gradle assembleDebug --no-daemon
      - name: Yayınla
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zaman-durbunu.apk
          gh release delete son --yes --cleanup-tag || true
          gh release create son zaman-durbunu.apk --title "Zaman Dürbünü (son sürüm)" --notes "Android için. Telefona indirip açın."
